<!DOCTYPE html>
<html lang="fr" data-anim="light" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undercover</title>
<meta name="theme-color" content="#19c7b0">
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/widgets.css">
<style>
.word{font-size:clamp(2rem,10vw,3.2rem);font-weight:800;text-align:center;margin:10px 0;word-break:break-word}
.secret{background:var(--surface);border:3px solid var(--edge);border-radius:22px;padding:22px 16px;box-shadow:7px 7px 0 var(--teal);text-align:center;margin:14px 0}
.tag{display:inline-block;background:var(--amber);color:#1b1340;border:2px solid var(--edge);border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:800;margin:2px}
.ban{background:var(--pink);color:#fff;border:2.5px solid var(--edge);border-radius:14px;padding:10px 14px;font-weight:800;margin:10px 0;box-shadow:3px 3px 0 var(--sh)}
.cur{box-shadow:3px 3px 0 var(--pink)!important;background:color-mix(in srgb,var(--pink) 18%,var(--surface))}
.timer{font-size:2.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.sp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--edge)}.sp:first-child{border-top:0}.sp span{flex:1}.sp small{display:block;color:var(--muted);font-weight:500}
.tog{width:46px;height:26px;border-radius:99px;border:2.5px solid var(--edge);background:var(--surface);position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:left .15s}
.tog.on{background:var(--teal)}.tog.on::after{left:22px}
.mini{font-size:.82rem;padding:4px 8px;width:auto}
.secret{position:relative;overflow:hidden}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:6px solid var(--danger);color:var(--danger);font-weight:800;font-size:clamp(1.8rem,9vw,2.8rem);letter-spacing:.12em;padding:.05em .35em;border-radius:12px;background:color-mix(in srgb,var(--surface) 55%,transparent);opacity:.92;pointer-events:none;text-transform:uppercase}
.stamp.play{animation:stampIn .55s cubic-bezier(.2,1.7,.4,1) both}
.secret.hit{animation:hit .35s .22s}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(3.4);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.92}}
@keyframes hit{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,0)}}
.rl{font-weight:800}.rl.civil{color:var(--teal)}.rl.uc{color:var(--danger)}.rl.mw{color:var(--violet)}
</style>
<link rel="stylesheet" href="/themes/undercover.css">
</head><body>
<main class="wrap">
<div class="top"><a href="/">← Hub</a><span id="who" class="hint"></span></div>
<div id="app"></div>
</main>
<script src="/shared/net.js"></script>
<script src="/shared/theme.js"></script>
<script src="/shared/profile.js"></script>
<script src="/shared/gages.js"></script>
<script src="/shared/party.js"></script>
<script>
"use strict";
/* ===================== DONNÉES ===================== */
const BASE_MIN=3,BASE_MAX=20;
const SPECIALS={
 goddess:{ico:"⚖️",n:"Déesse de la Justice",min:3,d:"Départage les égalités, même éliminée."},
 lovers:{ico:"💕",n:"Les Amoureux",min:5,d:"2 joueurs liés : si l’un est éliminé, l’autre aussi."},
 avenger:{ico:"🗡️",n:"Le Vengeur",min:5,d:"Éliminé, il emporte quelqu’un avec lui."},
 duelists:{ico:"⚔️",n:"Les Duellistes",min:5,d:"Duel secret : le premier éliminé perd 2 pts, l’autre en gagne 2."},
 ghost:{ico:"👻",n:"Le Fantôme",min:3,d:"Éliminé, il continue de discuter et de voter."},
 falafel:{ico:"🥙",n:"Vendeur de falafels",min:4,d:"Chaque manche, donne un falafel : il protège ou sabote."},
 boomerang:{ico:"🪃",n:"Le Boomerang",min:3,d:"1re fois visé par la majorité : les votes retombent sur leurs auteurs."},
 fool:{ico:"🤪",n:"Le Fou joyeux",min:3,d:"S’il est le premier éliminé : +4 points."}
};
const RL={civil:"Civil",uc:"Undercover",mw:"Mr. White"};
const ADULT_CATS=["🔞 18+"];
const BANK={
"🍕 Nourriture":[["pizza","quiche"],["café","thé"],["croissant","pain au chocolat"],["Nutella","pâte à tartiner"],["sushi","maki"],["frites","chips"],["beurre","margarine"],["miel","confiture"],["Coca","Pepsi"],["burger","sandwich"],["crêpe","gaufre"],["camembert","brie"],["baguette","pain de mie"],["glace","sorbet"]],
"🐾 Animaux":[["chat","tigre"],["chien","loup"],["dauphin","requin"],["lapin","lièvre"],["abeille","guêpe"],["crocodile","alligator"],["cheval","poney"],["corbeau","pigeon"],["escargot","limace"],["grenouille","crapaud"]],
"🧰 Objets":[["stylo","crayon"],["canapé","fauteuil"],["lunettes","lentilles"],["couteau","ciseaux"],["valise","sac à dos"],["montre","réveil"],["tasse","verre"],["tapis","moquette"],["parapluie","imperméable"],["bougie","lampe"]],
"📍 Lieux":[["plage","piscine"],["cinéma","théâtre"],["hôpital","clinique"],["musée","galerie"],["Paris","Lyon"],["montagne","colline"],["supermarché","épicerie"],["aéroport","gare"],["bibliothèque","librairie"],["hôtel","auberge"]],
"👷 Métiers":[["médecin","infirmier"],["professeur","instituteur"],["pompier","policier"],["chanteur","rappeur"],["boulanger","pâtissier"],["avocat","juge"],["pilote","steward"],["cuisinier","serveur"]],
"⚽ Football":[["Messi","Ronaldo"],["Mbappé","Neymar"],["penalty","coup franc"],["gardien","défenseur"],["Ligue 1","Premier League"],["Coupe du monde","Euro"],["PSG","OM"],["maillot","short"],["corner","touche"],["arbitre","VAR"],["dribble","passement de jambes"],["Zidane","Platini"],["Real Madrid","FC Barcelone"],["Ballon d'or","Soulier d'or"],["tacle","faute"],["stade","pelouse"]],
"📺 Séries & cinéma":[["Game of Thrones","Le Seigneur des Anneaux"],["Stranger Things","Dark"],["Breaking Bad","Peaky Blinders"],["Friends","How I Met Your Mother"],["Netflix","Disney+"],["Squid Game","Hunger Games"],["La Casa de Papel","Lupin"],["Titanic","Avatar"],["Star Wars","Star Trek"],["Marvel","DC Comics"],["Shrek","Madagascar"],["Les Simpson","South Park"],["The Office","Parks and Recreation"],["Pixar","DreamWorks"],["Astérix","Tintin"]],
"🌐 Culture web":[["Twitch","YouTube"],["TikTok","Reels"],["mème","GIF"],["Discord","WhatsApp"],["influenceur","streamer"],["ChatGPT","Google"],["Wikipédia","Reddit"],["emoji","sticker"],["selfie","story"],["podcast","webradio"],["Fortnite","Minecraft"],["Snapchat","Instagram"],["abonnés","followers"],["Spotify","Deezer"],["Amazon","AliExpress"],["Uber","BlaBlaCar"]],
"🔞 18+":[["baiser","câlin"],["Tinder","Meetic"],["rencard","rendez-vous"],["ex","crush"],["bière","vin"],["strip-tease","danse"],["massage","câlin"],["drague","séduction"],["mojito","cocktail"],["boîte de nuit","bar"],["lingerie","maillot de bain"],["jalousie","envie"],["fantasme","rêve"],["lune de miel","voyage de noces"],["coup de foudre","flirt"],["gueule de bois","fatigue"]],
"🎉 Loisirs":[["Netflix","YouTube"],["Harry Potter","Seigneur des Anneaux"],["guitare","violon"],["football","rugby"],["tennis","ping-pong"],["Instagram","TikTok"],["jeu vidéo","jeu de société"],["ski","snowboard"],["karaoké","concert"],["Noël","Nouvel An"],["vacances","week-end"],["mariage","anniversaire"]]
};
const DEF_CFG=()=>({assign:"auto",nu:1,nw:1,mwGuess:true,ghostAll:false,typed:false,meme:false,tDesc:0,tDisc:0,
 pts:{civil:2,uc:10,mw:6},sp:{},cats:Object.keys(BANK).filter(k=>!ADULT_CATS.includes(k)),words:"random",custom:"",pick:"",manual:{}});
/* ===================== ÉTAT ===================== */
let R=null,S=null,H=null,isHost=false,code="",L={name:"",gate:false,priv:null,show:false,mode:"local",pub:[]};
const local=()=>S&&S.mode==="local";
const pl=id=>S.pl.find(p=>p.id===id);
const nm=id=>(pl(id)||{n:"?"}).n;
const aliveIds=()=>S.pl.filter(p=>p.alive).map(p=>p.id);
const app=$("#app");
const bc=()=>{if(R&&isHost){if(H){S.vdone=Object.keys(H.votes||{}).length;S.vneed=voters().length}else{S.vdone=0;S.vneed=0}R.emit("st",S).catch(()=>{});R.snap({S,H})}};
const send=d=>{d.p=local()?(S.pr?S.pr.who:ME):ME;if(isHost)act(d);else R&&R.emit("act",d,"host")};
const uid=()=>"p"+Math.random().toString(36).slice(2,7);
try{L.name=localStorage.getItem("soiree:name")||""}catch(e){}

/* ===================== LOGIQUE HÔTE ===================== */
function newState(mode){
 return{ph:"lobby",mode,host:ME,pl:[],cfg:DEF_CFG(),r:0,pr:null,out:[],clues:[],log:[],tally:null,win:null,rv:null,meme:null,fal:null,order:[],turn:0,end:0,rt:0};
}
function counts(n){
 const c=S.cfg;
 if(c.assign==="manual")return{u:Math.min(c.nu,n-2),w:Math.min(c.nw,n-2)};
 if(c.assign==="random"){const tot=Math.max(1,Math.floor(Math.random()*Math.max(1,Math.floor(n/3)))+1);let w=n>=5?Math.floor(Math.random()*(tot+1)):0;let u=tot-w;if(!u&&!w)u=1;return{u,w}}
 return{u:Math.max(1,Math.floor(n/4)),w:n>=5?(n>=10?2:1):0};
}
function pickWords(){
 const c=S.cfg;let pairs=[];
 const cust=c.custom.split("\n").map(l=>l.split(/[\/|;]/).map(x=>x.trim())).filter(a=>a.length>=2&&a[0]&&a[1]);
 const bank=c.cats.flatMap(k=>BANK[k]||[]);
 if(c.words==="custom"&&cust.length)pairs=cust;
 else if(c.words==="pick"&&c.pick){const f=bank.concat(cust).find(p=>p.join(" / ")===c.pick);if(f)pairs=[f]}
 if(!pairs.length)pairs=bank.concat(cust);
 if(!pairs.length)pairs=Object.entries(BANK).filter(([k])=>!ADULT_CATS.includes(k)).flatMap(([,v])=>v);
 const p=pickR(pairs);return Math.random()<.5?{civ:p[0],uc:p[1]}:{civ:p[1],uc:p[0]};
}
function deal(){
 const n=S.pl.length;if(n<BASE_MIN)return toast("Il faut au moins 3 joueurs");
 const c=S.cfg,ids=shuffle(S.pl.map(p=>p.id));H={role:{},words:pickWords(),votes:{},q:[],dead:[],bonus:{},boom:false,fal:null,seen:{}};
 ids.forEach(id=>H.role[id]={base:null,sp:[]});
 const man=c.assign==="manual";
 if(man)ids.forEach(id=>{const m=c.manual[id]||{};if(m.base&&m.base!=="auto")H.role[id].base=m.base;if(m.sp&&m.sp!=="none")H.role[id].sp.push(m.sp)});
 let{u,w}=counts(n);
 const fx=b=>ids.filter(i=>H.role[i].base===b).length;
 u=Math.max(0,u-fx("uc"));w=Math.max(0,w-fx("mw"));
 const free=ids.filter(i=>!H.role[i].base);
 free.forEach((id,i)=>{H.role[id].base=i<u?"uc":i<u+w?"mw":"civil"});
 if(!ids.some(i=>H.role[i].base!=="civil")){H.role[free[0]||ids[0]].base="uc"}
 // rôles spéciaux (pas ceux déjà fixés manuellement)
 const have=k=>ids.filter(i=>H.role[i].sp.includes(k));
 const noSp=()=>shuffle(ids.filter(i=>!H.role[i].sp.length));
 for(const k of Object.keys(SPECIALS)){
  if(!man||true){ if(!c.sp[k]||n<SPECIALS[k].min||have(k).length)continue;
   const need=(k==="lovers"||k==="duelists")?2:1,pool=noSp();if(pool.length<need)continue;pool.slice(0,need).forEach(i=>H.role[i].sp.push(k));}
 }
 for(const k of["lovers","duelists"]){const a=have(k);if(a.length!==2)a.forEach(i=>H.role[i].sp=H.role[i].sp.filter(x=>x!==k))}
 ids.forEach(id=>{const r=H.role[id];r.word=r.base==="civil"?H.words.civ:r.base==="uc"?H.words.uc:null});
 S.pl.forEach(p=>{p.alive=true;p.gh=false});S.out=[];S.win=null;S.r=0;S.pr=null;S.rv=null;
 S.n={u:ids.filter(i=>H.role[i].base==="uc").length,w:ids.filter(i=>H.role[i].base==="mw").length,c:ids.filter(i=>H.role[i].base==="civil").length};
 S.ph="deal";
 if(local()){S.pr={who:S.pl[0].id,kind:"deal",i:0};L.gate=false}
 else sendPrivs();
}
function partnerOf(id,k){const o=Object.keys(H.role).find(x=>x!==id&&H.role[x].sp.includes(k));return o}
function privOf(id){
 const r=H.role[id];
 return{word:r.word,mw:r.base==="mw",sp:r.sp,pt:r.sp.includes("lovers")?nm(partnerOf(id,"lovers")):null,du:r.sp.includes("duelists")?nm(partnerOf(id,"duelists")):null};
}
function sendPrivs(){S.pl.forEach(p=>{if(p.id===ME)L.priv=privOf(p.id);else R&&R.emit("priv",privOf(p.id),p.id)})}
function startRound(){
 if(!local())sendPrivs();S.r++;S.clues=[];S.tally=null;S.rv=null;H.votes={};S.fal=null;H.fal=null;S.cand=null;S.revoted=false;
 const al=shuffle(aliveIds());S.order=al;S.turn=0;
 S.meme=S.cfg.meme&&al.length?pickR(al):null;
 S.ph="describe";S.end=S.cfg.tDesc?Net.now()+S.cfg.tDesc*1000:0;
 const fs=al.find(i=>H.role[i].sp.includes("falafel"));
 if(fs&&al.length>1)S.pr={who:fs,kind:"falafel"};
 else if(local()&&false){}
}
function voters(){return S.pl.filter(p=>(p.alive||(S.cfg.ghostAll||p.gh))&&!(H&&H.fal&&H.fal.kind==="bad"&&H.fal.to===p.id)).map(p=>p.id)}
function startVote(){
 S.ph="vote";H.votes={};S.end=Net.now()+45000; // filet de sécurité : le vote se clôture tout seul
 if(local()){H.vq=voters();S.pr={who:H.vq[0],kind:"vote",i:0};L.gate=false}
}
function act(d){
 if(!isHost||!S)return;const p=d.p;const host=local()||p===S.host;
 const k=d.k;
 if(k==="join"){if(!pl(p)&&S.ph==="lobby"&&S.pl.length<BASE_MAX)S.pl.push({id:p,n:(d.n||"?").slice(0,22),alive:true,sc:0,gh:false});}
 else if(k==="add"&&host&&local()&&S.ph==="lobby"&&S.pl.length<BASE_MAX){const n=(d.n||"").trim().slice(0,14);if(n)S.pl.push({id:uid(),n,alive:true,sc:0,gh:false})}
 else if(k==="del"&&host&&S.ph==="lobby")S.pl=S.pl.filter(x=>x.id!==d.id);
 else if(k==="cfg"&&host&&S.ph==="lobby")deepSet(S.cfg,d.path,d.v);
 else if(k==="start"&&host&&S.ph==="lobby")deal();
 else if(k==="pseen"){/* local: lecture du mot */ if(S.pr&&S.pr.kind==="deal"&&S.pr.who===p){const i=S.pr.i+1;if(i<S.pl.length){S.pr={who:S.pl[i].id,kind:"deal",i};L.gate=false}else{S.pr=null;startRound()}}}
 else if(k==="go"&&host&&S.ph==="deal"&&!local()){startRound()}
 else if(k==="needpriv"){if(H&&H.role&&H.role[p]&&R){const pv=privOf(p);if(H.fal&&H.fal.kind==="bad"&&H.fal.to===p)pv.nov=true;if(p===ME)L.priv=pv;else R.emit("priv",pv,p)}}
 else if(k==="fal"&&S.pr&&S.pr.kind==="falafel"&&S.pr.who===p&&aliveIds().includes(d.to)){H.fal={to:d.to,kind:d.kind==="bad"?"bad":"good"};S.fal=d.to;if(H.fal.kind==="bad"&&!local()){const pv={...privOf(d.to),nov:true};if(d.to===ME)L.priv=pv;else R.emit("priv",pv,d.to)}S.pr=null;if(local())L.gate=false}
 else if(k==="nxt"&&S.ph==="describe"&&!S.pr&&(host||S.order[S.turn]===p)){if(d.t&&S.cfg.typed)S.clues.push({id:S.order[S.turn],t:String(d.t).slice(0,80)});S.turn++;S.end=S.cfg.tDesc?Net.now()+S.cfg.tDesc*1000:0;if(S.turn>=S.order.length){S.ph="discuss";S.end=S.cfg.tDisc?Net.now()+S.cfg.tDisc*1000:0}}
 else if(k==="vote"&&host&&S.ph==="discuss")startVote();
 else if(k==="vote!"&&host&&S.ph==="vote"&&!local())resolveVote();
 else if(k==="cast"&&S.ph==="vote"){
   const ok=voters().includes(p)&&(!S.cand||S.cand.includes(d.to))&&pl(d.to)&&(pl(d.to).alive)&&d.to!==p;
   if(ok){H.votes[p]=d.to;
    if(local()){const i=S.pr.i+1;if(i<H.vq.length){S.pr={who:H.vq[i],kind:"vote",i};L.gate=false}else{S.pr=null;resolveVote()}}
    else if(voters().every(v=>H.votes[v]))resolveVote();}}
 else if(k==="gd"&&S.pr&&S.pr.kind==="goddess"&&S.pr.who===p&&S.pr.opts.includes(d.to)){S.pr=null;S.rv={goddess:true};H.q=[{t:"elim",id:d.to}];proc()}
 else if(k==="av"&&S.pr&&S.pr.kind==="avenger"&&S.pr.who===p&&aliveIds().includes(d.to)){S.pr=null;H.q.unshift({t:"elim",id:d.to});proc()}
 else if(k==="mwg"&&S.pr&&S.pr.kind==="mwguess"&&S.pr.who===p){
   S.pr=null;const g=String(d.t||"").trim().toLowerCase(),w=H.words.civ.toLowerCase();
   const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
   if(norm(g)===norm(w)&&g){S.log.push("🎯 "+nm(p)+" a deviné « "+H.words.civ+" » !");finishGame("mw",p)}else{S.log.push("❌ "+nm(p)+" a répondu « "+(d.t||"…")+" ». Raté !");proc()}}
 else if(k==="next"&&host&&S.ph==="result"){if(S.win)finishGame(S.win);else startRound()}
 else if(k==="again"&&host&&S.ph==="end"){S.sid=null;S.ph="lobby";S.pr=null;S.out=[];S.win=null;S.pl.forEach(x=>{x.alive=true;x.gh=false})}
 if(R&&!local())S.on=[...R.peers(),ME];
 bc();render();
}
function deepSet(o,path,v){const a=path.split(".");while(a.length>1){const k=a.shift();o=o[k]=o[k]||{}}o[a[0]]=v}
function resolveVote(){
 const vs=voters();let cnt={};const cand=S.cand||aliveIds();
 S.tally=Object.entries(H.votes).map(([f,t])=>({f,t}));
 cand.forEach(i=>cnt[i]=0);
 for(const[f,t]of Object.entries(H.votes))if(cnt[t]!==undefined)cnt[t]++;
 const top=o=>{const m=Math.max(0,...Object.values(o));return m?Object.keys(o).filter(i=>o[i]===m):[]};
 let tied=top(cnt);
 if(tied.length===1&&H.role[tied[0]].sp.includes("boomerang")&&!H.boom){
   H.boom=true;S.log.push("🪃 "+nm(tied[0])+" renvoie les votes à leurs auteurs !");
   const b=tied[0];cnt={};cand.forEach(i=>cnt[i]=0);
   for(const[f,t]of Object.entries(H.votes)){if(t===b){cnt[f]=(cnt[f]||0)+1}else if(t!==b&&cnt[t]!==undefined)cnt[t]++}
   delete cnt[b];tied=top(cnt);
 }
 if(H.fal&&H.fal.kind==="good"&&tied.includes(H.fal.to)){
   S.log.push("🥙 "+nm(H.fal.to)+" était protégé par son falafel !");delete cnt[H.fal.to];tied=top(cnt);}
 if(!tied.length){S.log.push("Aucun vote valable : personne n’est éliminé.");return endResult([])}
 if(tied.length>1){
   const g=Object.keys(H.role).find(i=>H.role[i].sp.includes("goddess"));
   if(g){S.log.push("⚖️ Égalité ! La Déesse de la Justice tranche.");S.pr={who:g,kind:"goddess",opts:tied};if(local())L.gate=false;return}
   if(!S.revoted){S.revoted=true;S.cand=tied;S.log.push("Égalité : nouveau vote entre "+tied.map(nm).join(", ")+".");H.votes={};return startVote()}
   S.log.push("Deuxième égalité : personne n’est éliminé.");return endResult([])
 }
 H.q=[{t:"elim",id:tied[0]}];proc();
}
function proc(){
 while(H.q.length){
  const st=H.q.shift();
  if(st.t==="elim"){
   const x=pl(st.id);if(!x||!x.alive)continue;
   x.alive=false;H.dead.push(st.id);const r=H.role[st.id];
   if(H.dead.length===1&&r.sp.includes("fool")){H.bonus[st.id]=(H.bonus[st.id]||0)+4}
   if(r.sp.includes("ghost"))x.gh=true;
   S.out.push({id:st.id,role:r.base,w:r.word,r:S.r});S.log.push("💀 "+x.n+" est éliminé — "+RL[r.base]+(r.word?" ("+r.word+")":""));
   const extra=[];
   if(r.sp.includes("lovers")){const o=partnerOf(st.id,"lovers");if(o&&pl(o).alive){S.log.push("💔 "+nm(o)+" meurt de chagrin.");extra.push({t:"elim",id:o})}}
   if(r.sp.includes("avenger")&&aliveIds().length>1)extra.push({t:"av",id:st.id});
   if(r.base==="mw"&&S.cfg.mwGuess)extra.push({t:"mw",id:st.id});
   H.q.unshift(...extra);
  }else if(st.t==="av"){S.pr={who:st.id,kind:"avenger"};if(local())L.gate=false;return}
  else if(st.t==="mw"){S.pr={who:st.id,kind:"mwguess"};if(local())L.gate=false;return}
 }
 endResult(S.out.filter(o=>o.r===S.r).map(o=>o.id));
}
function endResult(elim){
 const al=aliveIds(),civ=al.filter(i=>H.role[i].base==="civil").length,inf=al.length-civ;
 S.win=inf===0?"civil":civ<=1?"inf":null;S.ph="result";S.pr=null;
 S.rv=S.rv||{};
 // Quelqu'un vient d'être éliminé : on change le couple de mots pour la manche
 // suivante, sinon les joueurs restants gardent le même mot jusqu'à la fin.
 if(!S.win&&Array.isArray(elim)&&elim.length){
  H.words=pickWords();
  Object.keys(H.role).forEach(id=>{const r=H.role[id];r.word=r.base==="civil"?H.words.civ:r.base==="uc"?H.words.uc:null});
  S.words=H.words;
  if(!local())sendPrivs();
 }
}
function finishGame(w,who){
 const c=S.cfg.pts;
 S.pl.forEach(p=>{const r=H.role[p.id];let g=0;
  if(w==="civil"&&r.base==="civil")g=c.civil;
  else if(w==="inf"&&p.alive){g=r.base==="uc"?c.uc:r.base==="mw"?c.mw:0}
  else if(w==="mw"&&p.id===who)g=c.mw;
  g+=H.bonus[p.id]||0;
  const d=Object.keys(H.role).filter(i=>H.role[i].sp.includes("duelists"));
  if(r.sp.includes("duelists")&&d.length===2){const fi=H.dead.find(x=>d.includes(x));if(fi){g+=fi===p.id?-2:2}}
  p.g=g;p.sc+=g});
 S.win=w;S.ph="end";S.pr=null;S.words=H.words;
 if(!local()){S.sid=S.sid||uid();Party.report(R,"uc",S.sid,S.pl.map(p=>({id:p.id,n:p.n,s:p.g||0})))}S.roles=Object.fromEntries(Object.entries(H.role).map(([i,r])=>[i,{b:r.base,sp:r.sp}]));
}

async function startOnline(mode,create,joinCode,o){

  if(o.resume&&!e.status&&(o.net=(o.net||0)+1)<6){msg("📶 Reconnexion…");await sleep(2000);return startOnline(mode,create,joinCode,o)}
  if(o.resume)Sess.clear("uc");
  return msg(o.resume?"La partie n’existe plus. Tu peux en créer une nouvelle.":e.message);
 }
 isHost=R.host;
 if(create&&!isHost){R.leave();R=null;if(o.code){if(o.retry>0){await sleep(1500);return startOnline(mode,true,null,{...o,retry:o.retry-1})}return msg("Ce code est déjà utilisé, réessaie.")}return startOnline(mode,true,null,o)}
 Sess.save("uc",{code,name,host:isHost,mode});
 setInterval(()=>Sess.touch("uc"),20000);
 Party.listen(R,code,()=>Sess.clear("uc"));
 R.on("st",d=>{if(isHost||!d)return;S=d;if(S.ph==="lobby")L.priv=null;if(S.ph!=="vote")L.voted=false;render()});
 R.on("priv",d=>{L.priv=d;render()});

 R.onPromote(onPromoted);
 R.onDemote(()=>{isHost=false;toast("Un autre joueur est devenu l’hôte");render()});
 if(isHost){
  const snap=R.initSnap;
  if(snap&&snap.S){S=snap.S;H=snap.H||null;S.host=ME}else S=newState(mode);
  if(S.ph!=="lobby"&&!H)backToLobby();
  hostLoops();
  act({k:"join",p:ME,n:name});
  if(H&&S.ph!=="lobby")sendPrivs();
 }
 startHello();
}
function backToLobby(){S.ph="lobby";S.pr=null;S.out=[];S.win=null;S.sid=null;S.pl.forEach(x=>{x.alive=true;x.gh=false});toast("Partie interrompue : retour au salon")}
function hostLoops(){
 if(!L.hl)L.hl=setInterval(bc,2500);
 if(S.mode==="public"&&!L.pubT){const reg=()=>isHost&&S&&S.ph==="lobby"?Net.pub({room:"uc-"+code,game:"uc",host:L.name,count:S.pl.length,max:BASE_MAX}):Net.pub({room:"uc-"+code,close:true});reg();L.pubT=setInterval(reg,15000)}
}
function startHello(){
 if(L.hello)return;
 const hello=()=>{if(!R||isHost)return;
  if(!S||!pl(ME))R.emit("act",{k:"join",p:ME,n:L.name},"host");
  else if(S.ph!=="lobby"&&S.ph!=="end"&&!L.priv)R.emit("act",{k:"needpriv",p:ME},"host")};
 hello();L.hello=setInterval(hello,2000);
}
/* Passage de relais : le serveur nous a désignés hôte (l'ancien hôte a disparu) */
function onPromoted(snap){
 isHost=true;
 if(snap&&snap.S){S=snap.S;H=snap.H||null}
 if(!S)S=newState("private");
 S.host=ME;
 if(!pl(ME))S.pl.push({id:ME,n:L.name,alive:true,sc:0,gh:false});
 if(S.ph!=="lobby"&&!H)backToLobby();
 hostLoops();
 if(H&&S.ph!=="lobby")sendPrivs();
 Sess.save("uc",{code,name:L.name,host:true,mode:S.mode});
 L.sig="";toast("👑 Tu es maintenant l’hôte");bc();render();
}
function startLocal(){const name=$("#pname").value.trim().slice(0,14);if(name){L.name=name;try{localStorage.setItem("soiree:name",name)}catch(e){}}
 isHost=true;S=newState("local");act({k:"join",p:ME,n:L.name||"Joueur 1"});}
const msg=t=>{const e=$("#hmsg");if(e)e.textContent=t};

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT"||b.tagName==="TEXTAREA")return;const a=b.dataset.a,d=b.dataset;
 if(a==="m-local")startLocal();
 else if(a==="m-private")startOnline("private",true);
 else if(a==="m-public")startOnline("public",true);
 else if(a==="join"){const c=$("#pcode").value.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c))return msg("Code à 4 caractères.");startOnline("private",false,c)}
 else if(a==="plist"){const l=await Net.pubList("uc");$("#publist").innerHTML=l.length?l.map(r=>`<button class="pick" data-a="jpub" data-c="${r.room.slice(3)}">${esc(r.host)} · ${r.count}/${r.max}</button>`).join(""):"<p class='hint'>Aucun salon public ouvert pour l’instant.</p>"}
 else if(a==="jpub")startOnline("private",false,d.c);
 else if(a==="copy"){const u=location.origin+location.pathname+"?c="+code;try{await navigator.clipboard.writeText(u);toast("Lien copié")}catch(x){prompt("Lien :",u)}}
 else if(a==="leave"){Sess.clear("uc");if(R)R.leave();location.href=location.pathname}
 else if(a==="peek"){L.show=!L.show;render()}
 else if(a==="gate"){L.gate=true;render()}
 else if(a==="add"){const i=$("#addn");send({k:"add",n:i.value})}
 else if(a==="del")send({k:"del",id:d.id});
 else if(a==="set")send({k:"cfg",path:d.path,v:isNaN(d.v)||d.v===""?d.v:+d.v});
 else if(a==="tg"){const v=d.path.startsWith("sp.")?!S.cfg.sp[d.path.slice(3)]:!S.cfg[d.path];send({k:"cfg",path:d.path,v})}
 else if(a==="st"){const cur=d.path.split(".").reduce((o,k)=>o[k],S.cfg);send({k:"cfg",path:d.path,v:Math.max(+d.min,Math.min(+d.max,cur+ +d.d))})}
 else if(a==="cat"){const s=new Set(S.cfg.cats);if(!s.has(d.k)&&ADULT_CATS.includes(d.k)&&!confirm("Mots 18+ : réservés aux adultes consentants. Tout le monde est d'accord ?"))return;s.has(d.k)?s.delete(d.k):s.add(d.k);if(!s.size)s.add(d.k);send({k:"cfg",path:"cats",v:[...s]})}
 else if(a==="start")send({k:"start"});
 else if(a==="go")send({k:"go"});
 else if(a==="pseen"){L.gate=false;L.show=false;send({k:"pseen"})}
 else if(a==="nxt"){const c=$("#clue");send({k:"nxt",t:c?c.value:""});if(local())L.gate=false}
 else if(a==="vote")send({k:"vote"});
 else if(a==="vote!")send({k:"vote!"});
 else if(a==="cast"){L.voted=true;send({k:"cast",to:d.id});if(local())L.gate=false;render()}
 else if(a==="fal"){send({k:"fal",to:d.id,kind:d.k});L.gate=false}
 else if(a==="gd"){send({k:"gd",to:d.id});L.gate=false}
 else if(a==="av"){send({k:"av",to:d.id});L.gate=false}
 else if(a==="mwg"){send({k:"mwg",t:$("#mwg").value});L.gate=false}
 else if(a==="next"){send({k:"next"});L.gate=false}
 else if(a==="again")send({k:"again"});
});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a==="man"){const m={...(S.cfg.manual[t.dataset.id]||{})};m[t.dataset.f]=t.value;send({k:"cfg",path:"manual."+t.dataset.id,v:m})}
 else if(a==="pickw")send({k:"cfg",path:"pick",v:t.value});
 else if(a==="cust")send({k:"cfg",path:"custom",v:t.value})});
addEventListener("beforeunload",()=>R&&R.leave());
render();
(function boot(){
 const BP=bootParams(),s=Sess.load("uc"),pr=Profile.get();
 if(BP.go&&BP.code&&pr.name){
  const n0=Profile.tag(pr.name);msg("🎪 Lancement de la partie…");
  if(BP.host)startOnline("private",true,null,{name:n0,code:BP.code,retry:5});
  else startOnline("private",false,BP.code,{name:n0,retry:20});
 }else if(s&&s.mode!=="local"&&(!BP.code||BP.code===s.code)){
  msg("🔁 Retour dans le salon "+s.code+"…");
  startOnline(s.mode,false,s.code,{name:s.name,resume:true,wasHost:s.host});
 }
})();
</script></body></html>
